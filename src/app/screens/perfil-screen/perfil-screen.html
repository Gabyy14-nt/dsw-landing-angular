<section class="container py-5">
  <div class="card shadow-sm">
    <div class="row g-0 align-items-center">
      <div class="col-md-4 text-center p-4">
        <img src="assets/img/foto_perfil.jpg" alt="Fotografía de perfil" class="img-fluid rounded-circle" width="200">
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <h2 class="card-title mb-3">{{ perfil.nombre }}</h2>
          <ul class="list-unstyled mb-0">
            <li class="mb-2"><i class="bi bi-envelope me-2"></i> {{ perfil.email }}</li>
            <li class="mb-2"><i class="bi bi-telephone me-2"></i> {{ perfil.telefono }}</li>
            <li class="mb-2"><i class="bi bi-geo-alt me-2"></i> {{ perfil.direccion }}</li>
            <li><i class="bi bi-calendar-event me-2"></i> {{ perfil.nacimiento }}</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</section>
